name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl
          coverage: none
      - name: PHP syntax
        run: find app bin tests movie-recommendation-website -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain tests
        run: php tests/domain.php
      - name: Security regressions
        run: php tests/security.php
      - name: Concurrent authentication limiter
        run: python3 tests/throttle_concurrency.py
      - name: Content-based recommendations
        run: php tests/recommendations.php
      - name: Production transport configuration
        run: python3 tests/deployment_test.py
      - name: Poster integration tests (offline fixtures)
        run: php tests/posters.php
      - name: TMDB HTTP retries and safe diagnostics
        run: php tests/tmdb-http.php
      - name: Reviewed identities and preserved successful matches
        run: php tests/reviewed-posters.php
      - name: Actual synchronization CLI
        run: python3 tests/sync_cli_test.py
      - name: HTTP integration tests
        run: python3 tests/http_test.py
      - name: Poster image failure handler
        run: node tests/posters-js.cjs
